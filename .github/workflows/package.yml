name: Package

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: normlanguage/registry/.github/actions/setup-norm@90b4d247fa4f5f2b620924d2cbc0553e89843700
        with:
          version: 0.27.23
      - uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: 25.0.2
      - name: Build backend and consumer
        shell: pwsh
        run: |
          ./scripts/build.ps1
          ./gradlew.bat :test --tests 'dev.normlanguage.ui.web.WebNodeTest' --tests 'dev.normlanguage.ui.web.WebSessionTest' --tests 'dev.normlanguage.ui.web.LibraryPackagingTest' --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: build/repository
      - name: Generate repository Skill
        shell: pwsh
        run: ./scripts/norm.ps1 docs ui/web --output build/api --skill SKILL.md
      - uses: normlanguage/registry/.github/actions/package-module@90b4d247fa4f5f2b620924d2cbc0553e89843700
        id: package
        with:
          module-path: ui/web
          norm-executable: ./scripts/norm.ps1
          cache-directory: .norm-home/.norm/cache/packages/github
      - name: Verify renderer and consumer
        shell: pwsh
        run: |
          ./scripts/norm.ps1 test ui/web --filter ui.web.test.rendering
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/norm.ps1 check samples/demo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/test-results
      - uses: normlanguage/registry/.github/actions/publish-module@90b4d247fa4f5f2b620924d2cbc0553e89843700
        with:
          archive: ${{ steps.package.outputs.archive }}
          version: ${{ steps.package.outputs.version }}

