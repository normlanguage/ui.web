name: Package

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: normlanguage/registry/.github/actions/setup-norm@d229852448570c786a3f86e62c7db36769ed9a18
        with:
          source-ref: 9dd8571427f77e7fa9b9adab38ac1272f7d82d2a
      - uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: 25.0.2
      - name: Build backend and production frontend
        shell: pwsh
        run: |
          ./gradlew.bat test --tests 'dev.normlanguage.ui.web.WebNodeTest' --tests 'dev.normlanguage.ui.web.WebSessionTest' publish --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cache = Join-Path $HOME '.norm/cache/maven'
          New-Item -ItemType Directory -Force $cache | Out-Null
          Copy-Item -Path build/repository/* -Destination $cache -Recurse -Force
      - uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: build/repository
      - name: Locate Module
        id: module
        shell: bash
        run: |
          mapfile -d '' modules < <(find . -type f -name module.norm -not -path './.git/*' -not -path './.tmp/*' -not -path './.norm/*' -not -path './.norm-home/*' -not -path './build/*' -not -path './node_modules/*' -not -path './examples/*' -not -path './sample/*' -not -path './samples/*' -print0)
          [[ "${#modules[@]}" == 1 ]]
          echo "path=${modules[0]}" >> "$GITHUB_OUTPUT"
      - name: Package
        shell: bash
        run: |
          norm package "${{ steps.module.outputs.path }}" --output build/repository
          git diff --exit-code -- "${{ steps.module.outputs.path }}"
          mkdir -p "$HOME/.norm/cache/packages/github"
          cp -R build/repository/. "$HOME/.norm/cache/packages/github/"
      - name: Verify renderer and example
        shell: bash
        run: |
          timeout 300 norm test ui/web --filter ui.web.test.rendering
          norm check samples/demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/test-results
      - name: Select release artifact
        id: artifact
        shell: bash
        run: |
          mapfile -t archives < <(find build/repository -type f -name '*.nar')
          [[ "${#archives[@]}" == 1 ]]
          archive="${archives[0]}"
          version="${archive%.nar}"
          version="${version##*-}"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: ${{ steps.artifact.outputs.archive }}
      - name: Publish immutable release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.artifact.outputs.archive }}
          VERSION: ${{ steps.artifact.outputs.version }}
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" == "v$VERSION" ]]
          state="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          [[ "$state" != "false" ]]
          if [[ "$state" == "missing" ]]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
